seed: 123
output_dir: results/mnist_lenet5_smoothgrad
dataset:
  name: mnist
  root: ./data
  normalization: none
  image_size: 28
model:
  name: lenet5
  pretrained: false
checkpoint: results/mnist_lenet5/best.pt
train:
  batch_size: 128
  lr: 0.001
  epochs: 20
  num_workers: 4
test:
  num_seeds: 100
finetune:
  epochs: 10
bayeswarp:
  saliency_method: smoothgrad
  alpha: 0.1
  area_min: 25
  tau_iou: 0.3
  d_max: 6
  rho: 0.6
  S: 32
  eta: 0.1
  r: 0.1
  beta_min: 0.01
  beta_max: 0.05
  epsilon: 0.0005
  kappa: 1.0
  n: 1
  m: 64
  budget: 10000
  max_target_classes: 9
baselines:
  adapt:
    k: 10
    lr: 0.1
    trail: 3
    delta: 0.5
    class_weight: 0.5
    neuron_weight: 0.5
    theta: 0.5
  nsgen:
    alpha_accept: 0.81
    alpha_frac: 0.2
    beta_frac: 0.4
    try_num: 50
    topk: 1
    pseudo_topk: 1
  suntest:
    b: 1000
    K: 100
    lam: 0.1
    q: 0.8
    formula: dstar
    star: 3
    localization_samples: 2000
